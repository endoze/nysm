version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Also update indirect dependencies: release-plz no longer runs cargo update.
    allow:
      - dependency-type: all
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    # dist generates release.yml from dist-workspace.toml; bump its action
    # pins there and regenerate, or the next regeneration reverts them.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
