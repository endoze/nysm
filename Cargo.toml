[package]
name = "nysm"
version = "0.2.4"
edition = "2024"
description = "Manage secrets from Secrets Providers."
authors = ["Endoze <endoze@endozemedia.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/Endoze/nysm"
documentation = "https://docs.rs/nysm"
rust-version = "1.94.1"
keywords = ["secrets", "aws", "cli", "secretsmanager", "security"]
categories = ["command-line-utilities", "config", "authentication"]

[lib]
name = "nysm"

[dependencies]
async-trait = "0.1"
aws-config = "1.13.3"
aws-sdk-secretsmanager = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-types = "1.7.0"
base64 = "0.23"
bat = "0.26"
clap = { version = "4.6", features = ["derive", "env"]}
crypto_box = { version = "0.9", features = ["seal"] }
octocrab = "0.54"
reqwest = { version = "0.13", features = ["json", "query", "rustls-no-provider"], default-features = false }
rustls = { version = "0.23", features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1.1"
tabled = "0.22"
tempfile = "3"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
google-cloud-secretmanager-v1 = { version = "2.0.0", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }

[dev-dependencies]
lazy_static = { version = "1.5.0" }
futures = "0.3.33"

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
